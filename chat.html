<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Шилов AI</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script><style>
:root{--bg:#10110f;--side:#151815;--surface:#1b1f1b;--surface2:#242924;--line:#2b302b;--text:#eef0eb;--muted:#a0a79f;--accent:#c5e7a2;--ink:#182017}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'DM Sans',sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:275px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:15px;flex-shrink:0;transition:transform .22s}.brand{font:800 18px Manrope;text-decoration:none;color:var(--text)}.brand span{color:var(--accent)}.sidehead{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 16px}.icon{width:40px;height:40px;border:0;background:transparent;border-radius:11px;display:grid;place-items:center;color:var(--muted)}.icon:hover{background:var(--surface2);color:var(--text)}.new{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-weight:600}.historylabel{padding:22px 8px 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.history{overflow:auto;flex:1}.history button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.history button:hover,.history button.active{background:var(--surface2);color:var(--text)}.sidefoot{border-top:1px solid var(--line);padding-top:10px}.back{display:flex;gap:8px;align-items:center;color:var(--muted);padding:10px;text-decoration:none;font-size:13px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:62px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.toplabel{font-weight:700}.toplabel small{color:var(--muted);font-weight:500}.mobile{display:none}.area{flex:1;overflow:auto;padding:24px 16px}.conversation{max-width:780px;margin:auto;min-height:100%;display:flex;flex-direction:column;gap:24px}.welcome{margin:auto;width:100%;padding:24px 0 44px}.welcome h1{font:800 clamp(30px,5vw,48px)/1.14 Manrope;letter-spacing:-1.5px;margin:0 0 10px}.welcome p{color:var(--muted);margin:0 0 24px}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.suggestions button{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;color:var(--muted);font-size:13px}.suggestions button:hover{color:var(--text);border-color:#485246}.message{display:flex;gap:12px;align-items:flex-start}.message.user{justify-content:flex-end}.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--accent);color:var(--ink);font-size:12px;font-weight:800}.ai .avatar{background:var(--surface2);color:var(--accent);border:1px solid var(--line)}.bubble{max-width:min(88%,690px);overflow-wrap:anywhere}.user .bubble{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);padding:12px 16px;border-radius:18px}.ai .bubble{padding:2px 0}.bubble p{margin:0 0 12px}.bubble p:last-child{margin-bottom:0}.bubble h1,.bubble h2,.bubble h3{font-family:Manrope;margin:20px 0 8px}.bubble ul,.bubble ol{padding-left:22px}.bubble pre{background:#121512;border:1px solid var(--line);border-radius:12px;padding:13px;overflow:auto}.bubble code{background:var(--surface2);padding:2px 5px;border-radius:5px}.bubble pre code{background:transparent;padding:0}.bubble table{border-collapse:collapse;display:block;overflow:auto}.bubble td,.bubble th{border:1px solid var(--line);padding:7px}.typing{display:flex;gap:4px;padding:7px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,70%,100%{opacity:.35}35%{opacity:1;transform:translateY(-3px)}}.composewrap{padding:10px 16px max(12px,env(safe-area-inset-bottom))}.composein{max-width:780px;margin:auto}.compose{border:1px solid #3b423b;background:var(--surface);border-radius:19px;padding:10px;}.compose:focus-within{border-color:#53644d}.input{width:100%;border:0;outline:0;background:transparent;color:var(--text);resize:none;min-height:46px;max-height:170px;padding:6px 8px}.input::placeholder{color:#747b74}.tools{display:flex;justify-content:space-between;align-items:center}.send{width:40px;height:40px;border:0;border-radius:12px;background:var(--accent);color:var(--ink);display:grid;place-items:center}.send:disabled{opacity:.4}.hint{text-align:center;color:#778077;font-size:11px;padding-top:8px}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:8}@media(max-width:720px){.sidebar{position:fixed;inset:0 auto 0 0;z-index:10;width:min(290px,86vw);transform:translateX(-105%);box-shadow:20px 0 45px #0005}.sidebar.open{transform:none}.overlay.show{display:block}.mobile{display:grid}.top{height:58px;padding:0 12px}.area{padding:18px 12px}.suggestions{grid-template-columns:1fr}.composewrap{padding:8px 10px max(10px,env(safe-area-inset-bottom))}.conversation{gap:20px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="app"><aside class="sidebar" id="side"><div class="sidehead"><a class="brand" href="/">Шилов<span>.</span>Медиа</a><button class="icon" id="close" aria-label="Закрыть"><i data-lucide="panel-left-close"></i></button></div><button class="new" id="new"><i data-lucide="square-pen"></i> Новый чат</button><div class="historylabel">Недавние</div><div class="history" id="history"></div><div class="sidefoot"><a class="back" href="/"><i data-lucide="arrow-left"></i>На сайт</a></div></aside><div class="overlay" id="overlay"></div><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="icon mobile" id="open" aria-label="Меню"><i data-lucide="menu"></i></button><div class="toplabel">Шилов AI <small>· консультант</small></div></div><a class="icon" href="/" aria-label="Главная"><i data-lucide="house"></i></a></header><div class="area" id="area"><div class="conversation" id="conversation"><div class="welcome" id="welcome"><h1>Чем могу помочь?</h1><p>Спросите об услугах, стоимости, разработке или нейросетях.</p><div class="suggestions"><button data-prompt="Сколько стоит Telegram-бот с нейросетью?">Сколько стоит бот с ИИ?</button><button data-prompt="Что такое вайбкодинг?">Что такое вайбкодинг?</button><button data-prompt="Какие сайты вы можете разработать?">Какие сайты можно сделать?</button><button data-prompt="Как проходит разработка проекта?">Как проходит работа?</button></div></div></div></div><div class="composewrap"><div class="composein"><form class="compose" id="form"><textarea class="input" id="input" rows="1" placeholder="Напишите сообщение…"></textarea><div class="tools"><button type="button" class="icon" id="clear" title="Очистить"><i data-lucide="eraser"></i></button><button class="send" id="send" aria-label="Отправить"><i data-lucide="arrow-up"></i></button></div></form><div class="hint">ИИ может ошибаться. Проверяйте важную информацию.</div></div></div></main></div><script>
lucide.createIcons();const $=s=>document.querySelector(s),side=$('#side'),overlay=$('#overlay'),conversation=$('#conversation'),area=$('#area'),input=$('#input'),form=$('#form'),sendBtn=$('#send'),historyEl=$('#history');let chats=JSON.parse(localStorage.getItem('shilov-chats')||'[]'),active=null,messages=[],busy=false;function save(){localStorage.setItem('shilov-chats',JSON.stringify(chats))}function closeSide(){side.classList.remove('open');overlay.classList.remove('show')}$('#open').onclick=()=>{side.classList.add('open');overlay.classList.add('show')};$('#close').onclick=closeSide;overlay.onclick=closeSide;function renderHistory(){historyEl.innerHTML='';chats.forEach(c=>{let b=document.createElement('button');b.textContent=c.title||'Новый чат';b.className=active===c.id?'active':'';b.onclick=()=>load(c.id);historyEl.appendChild(b)})}function bindPrompts(el){el.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>send(b.dataset.prompt))}function newChat(){active=null;messages=[];conversation.innerHTML='';let w=$('#welcome').cloneNode(true);w.id='welcome';conversation.appendChild(w);bindPrompts(w);renderHistory();closeSide();input.value='';input.focus()}function load(id){let c=chats.find(x=>x.id===id);if(!c)return;active=id;messages=c.messages||[];conversation.innerHTML='';messages.forEach(m=>add(m.role,m.content,false));renderHistory();closeSide();area.scrollTop=area.scrollHeight}function ensure(){if(!active){active=Date.now().toString();chats.unshift({id:active,title:'Новый чат',messages:[]})}}function persist(){let c=chats.find(x=>x.id===active);if(c){c.messages=messages;let first=messages.find(m=>m.role==='user');if(c.title==='Новый чат'&&first)c.title=first.content.slice(0,40);save();renderHistory()}}function add(role,content,scroll=true){let row=document.createElement('div');row.className='message '+(role==='user'?'user':'ai');let av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'Вы':'AI';let bubble=document.createElement('div');bubble.className='bubble';if(role==='user')bubble.textContent=content;else{bubble.innerHTML=marked.parse(content||'');bubble.querySelectorAll('pre code').forEach(x=>hljs.highlightElement(x));if(window.renderMathInElement)renderMathInElement(bubble,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false})}if(role==='user'){row.append(bubble,av)}else row.append(av,bubble);conversation.appendChild(row);if(scroll)area.scrollTop=area.scrollHeight;return bubble}function typing(){let r=document.createElement('div');r.className='message ai';r.id='typing';r.innerHTML='<div class="avatar">AI</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';conversation.appendChild(r);area.scrollTop=area.scrollHeight}async function send(text){text=text.trim();if(!text||busy)return;busy=true;sendBtn.disabled=true;$('#welcome')?.remove();ensure();messages.push({role:'user',content:text});add('user',text);persist();input.value='';input.style.height='auto';typing();let acc='',bubble;try{let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});if(!res.ok)throw Error('HTTP '+res.status);if(!res.body)throw Error('Нет потока ответа');let reader=res.body.getReader(),decoder=new TextDecoder(),buf='';$('#typing')?.remove();bubble=add('assistant','',false);while(true){let{done,value}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});let lines=buf.split('\n');buf=lines.pop()||'';for(let line of lines){line=line.trim();if(!line.startsWith('data:'))continue;let data=line.slice(5).trim();if(!data||data==='[DONE]')continue;let j;try{j=JSON.parse(data)}catch{continue}let d=j?.choices?.[0]?.delta?.content??j?.choices?.[0]?.message?.content??'';if(d){acc+=d;bubble.innerHTML=marked.parse(acc);bubble.querySelectorAll('pre code').forEach(x=>hljs.highlightElement(x));if(window.renderMathInElement)renderMathInElement(bubble,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});area.scrollTop=area.scrollHeight}}}if(acc){messages.push({role:'assistant',content:acc});persist()}else bubble.textContent='Пустой ответ. Попробуйте ещё раз.'}catch(e){$('#typing')?.remove();if(!bubble)bubble=add('assistant','',false);bubble.textContent='Не удалось получить ответ: '+e.message+' · Можно написать в Telegram @shilovmedia';area.scrollTop=area.scrollHeight}finally{busy=false;sendBtn.disabled=false;input.focus()}}form.onsubmit=e=>{e.preventDefault();send(input.value)};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input.value)}};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,170)+'px'};$('#new').onclick=newChat;$('#clear').onclick=()=>{input.value='';input.focus()};bindPrompts($('#welcome'));renderHistory();
</script></body></html>
